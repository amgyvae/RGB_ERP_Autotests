name: Daily ERP Autotests (08:00 Almaty)

on:
  # Ежедневный утренний запуск в 07:00–08:00 по времени Алматы (UTC+5).
  # На бесплатных раннерах GitHub Actions очередь schedule может задерживаться от 0 до 7 часов
  # (из-за чего одиночный cron 02:45 UTC фактически стартовал в 13:50–14:45 Алматы).
  # Каскад триггеров покрывает задержки очереди от 0 до 7.5 ч, а шаг «gate» пропускает
  # РОВНО ОДИН запуск в сутки строго в утреннем окне Алматы (06:40–10:15 UTC+5)
  # и мгновенно отсекает ночные/послеобеденные срабатывания без уведомлений в Telegram.
  schedule:
    - cron: "30 19 * * *"
    - cron: "15 20 * * *"
    - cron: "0 21 * * *"
    - cron: "45 21 * * *"
    - cron: "30 22 * * *"
    - cron: "30 23 * * *"
    - cron: "30 0 * * *"
    - cron: "15 1 * * *"
    - cron: "0 2 * * *"
    - cron: "45 2 * * *"
  # Поддержка точного внешнего вебхука (например cron-job.org) при необходимости
  repository_dispatch:
    types: [run-autotests]
  # Кнопка «Run workflow» во вкладке Actions для ручного запуска.
  workflow_dispatch:
    inputs:
      modules:
        description: "Модули через запятую (all = все): contacts,passport,smeta,finance,supply,quality,discussions,wiki,news,manager,tasks,gpr,contracts,waybills,invoices,acts"
        required: false
        default: "all"
      ncalayer:
        description: "Модули с ЭЦП (NCALayer) на облачном раннере"
        type: choice
        options: [include, skip]
        default: include

# Не запускать два прогона одновременно: тесты пишут в одну таблицу и используют одни аккаунты.
concurrency:
  group: erp-autotests
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  TZ: Asia/Almaty
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  plan:
    name: Планирование прогона
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      matrix: ${{ steps.matrix.outputs.matrix || steps.gate.outputs.matrix }}
      modules: ${{ steps.matrix.outputs.modules || steps.gate.outputs.modules }}
      web_only: ${{ steps.matrix.outputs.web_only || steps.gate.outputs.web_only }}
    steps:
      - name: Проверка утреннего окна Алматы (07:00–10:15) и защита от дублей
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timedelta, timezone

          almaty_tz = timezone(timedelta(hours=5))
          now_alm = datetime.now(almaty_tz)
          event = os.environ.get("EVENT_NAME", "")
          repo = os.environ.get("REPO", "")
          cur_id = str(os.environ.get("CURRENT_RUN_ID", ""))
          token = os.environ.get("GH_TOKEN", "")
          out_path = os.environ["GITHUB_OUTPUT"]
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "")

          def finish(should_run: bool, reason: str):
              print(f"[GATE] {now_alm.strftime('%Y-%m-%d %H:%M:%S')} Almaty | event={event} | should_run={should_run} | {reason}")
              with open(out_path, "a", encoding="utf-8") as f:
                  f.write(f"should_run={'true' if should_run else 'false'}\n")
                  if not should_run:
                      f.write('matrix={"include":[]}\n')
                      f.write("modules=none\n")
                      f.write("web_only=true\n")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as sf:
                      sf.write(f"### Утренний фильтр запуска\n- Время Алматы: `{now_alm.strftime('%d.%m.%Y %H:%M:%S')} (UTC+5)`\n- Решение: `{'ЗАПУСК' if should_run else 'ПРОПУСК'}` — {reason}\n")

          if event != "schedule":
              finish(True, f"Ручной/внешний запуск ({event})")
              raise SystemExit(0)

          mins = now_alm.hour * 60 + now_alm.minute
          # Утреннее окно Алматы: с 06:40 до 10:15 (07:00–08:00 целевой старт + запас).
          # Все ночные и послеобеденные (13:00–15:00) запоздавшие cron-срабатывания отсекаются.
          if not (6 * 60 + 40 <= mins <= 10 * 60 + 15):
              finish(False, f"Вне утреннего окна 06:40–10:15 Алматы (сейчас {now_alm.strftime('%H:%M')})")
              raise SystemExit(0)

          def gh_get(url: str):
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "rgb-erp-morning-gate",
              })
              with urllib.request.urlopen(req, timeout=20) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          def parse_alm(ts: str):
              if not ts:
                  return None
              return datetime.fromisoformat(ts.replace("Z", "+00:00")).astimezone(almaty_tz)

          if repo and token:
              try:
                  runs_url = f"https://api.github.com/repos/{repo}/actions/workflows/morning-autotests.yml/runs?event=schedule&per_page=30"
                  runs = gh_get(runs_url).get("workflow_runs", [])
                  for r in runs:
                      rid = str(r.get("id", ""))
                      if not rid or rid == cur_id:
                          continue
                      started_alm = parse_alm(r.get("run_started_at") or r.get("created_at"))
                      if not started_alm or started_alm.date() != now_alm.date():
                          continue
                      jobs_data = gh_get(f"https://api.github.com/repos/{repo}/actions/runs/{rid}/jobs?per_page=50")
                      for job in jobs_data.get("jobs", []):
                          jname = job.get("name", "")
                          jstatus = job.get("status", "")
                          jconc = job.get("conclusion")
                          if jname == "Планирование прогона":
                              for st in job.get("steps", []):
                                  if "Список модулей" in st.get("name", "") and (
                                      st.get("conclusion") == "success" or st.get("status") == "in_progress"
                                  ):
                                      finish(False, f"Утренний прогон сегодня уже запущен/выполнен (run #{r.get('run_number')}, id={rid})")
                                      raise SystemExit(0)
                          else:
                              if jstatus in ("in_progress", "queued") or jconc not in (None, "skipped", "cancelled"):
                                  finish(False, f"Утренний прогон сегодня уже выполняется/выполнен (run #{r.get('run_number')}, id={rid})")
                                  raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  print(f"[GATE] Предупреждение при проверке истории запусков: {exc}")

          finish(True, "Первый утренний запуск за сегодня в окне 06:40–10:15 Алматы")
          PY

      - if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей для уведомлений
        if: steps.gate.outputs.should_run == 'true'
        run: python -m pip install requests gspread google-auth openpyxl

      - name: Список модулей и уведомление о старте в Telegram
        id: matrix
        if: steps.gate.outputs.should_run == 'true'
        env:
          MODULES: ${{ inputs.modules || vars.AUTOTEST_MODULES || 'all' }}
          # Headless NCALayer работает автономно на Java в headless-режиме (wss://127.0.0.1:13579)
          # на любом облачном раннере Ubuntu и на Windows. Пропускаем ЭЦП только если явно выбрано skip.
          WEB_ONLY: ${{ inputs.ncalayer == 'skip' }}
          TG_ENABLED: ${{ vars.TG_ENABLED || '1' }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHATS: ${{ secrets.TG_CHATS }}
          RGB_ACCOUNT1_LOGIN: jyktmargyplay2@gmail.com
        run: |
          FLAGS=""
          if [ "$WEB_ONLY" = "true" ]; then FLAGS="--web-only"; fi
          MATRIX=$(python run_all.py --matrix "$MODULES" $FLAGS)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"
          echo "web_only=$WEB_ONLY" >> "$GITHUB_OUTPUT"
          echo "### План прогона" >> "$GITHUB_STEP_SUMMARY"
          echo "Модули: \`$MODULES\` · только web: \`$WEB_ONLY\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$MATRIX"
          python run_all.py --notify-start "$MODULES" $FLAGS

      - name: Метаданные старта прогона
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: report-suite-meta-${{ github.run_number }}
          path: logs/suite_start_meta.json
          retention-days: 14
          if-no-files-found: ignore

  test:
    name: ${{ matrix.title }}
    needs: plan
    if: ${{ needs.plan.outputs.should_run == 'true' && fromJSON(needs.plan.outputs.matrix).include[0] }}
    # ubuntu-latest — облако GitHub; self-hosted — ваш Windows-ПК с NCALayer
    # (задаётся переменной репозитория AUTOTEST_RUNNER).
    runs-on: ${{ vars.AUTOTEST_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false   # упавший модуль не останавливает остальные
      max-parallel: 1    # строго по очереди
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      HEADLESS: ${{ vars.HEADLESS || '1' }}
      TG_ENABLED: ${{ vars.TG_ENABLED || '1' }}
      RGB_WEB_ONLY: ${{ needs.plan.outputs.web_only == 'true' && '1' || '0' }}
      RGB_ACCOUNT1_LOGIN: jyktmargyplay2@gmail.com
      RGB_ACCOUNT1_PASSWORD: '12341234'
      RGB_ACCOUNT1_PASSWORD_ALT: '12341234'
      RGB_ACCOUNT2_LOGIN: ${{ secrets.RGB_ACCOUNT2_LOGIN || 'dias.aldazharov@bk.ru' }}
      RGB_ACCOUNT2_PASSWORD: ${{ secrets.RGB_ACCOUNT2_PASSWORD || 'h7WxqKIR' }}
      RGB_ACCOUNT3_LOGIN: ${{ secrets.RGB_ACCOUNT3_LOGIN || 'aldazarovdias@gmail.com' }}
      RGB_ACCOUNT3_PASSWORD: ${{ secrets.RGB_ACCOUNT3_PASSWORD || '12341234' }}
      NCA_KEY1_PASSWORD: ${{ secrets.NCA_KEY1_PASSWORD || 'Aa200616.' }}
      NCA_KEY2_PASSWORD: ${{ secrets.NCA_KEY2_PASSWORD || 'Aa1979' }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHATS: ${{ secrets.TG_CHATS }}
      GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - name: Установка Java для Headless NCALayer
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: python -m pip install -r requirements.txt

      - name: Подготовка папки загрузок
        run: python -c "import os; os.makedirs(os.path.expanduser('~/Downloads'), exist_ok=True)"

      - name: Подготовка ключа Google Sheets
        run: |
          python -c "
          import os
          key = os.environ.get('GOOGLE_SERVICE_ACCOUNT_JSON', '').strip()
          if key and key != '-':
              with open('service_account.json', 'w', encoding='utf-8') as f:
                  f.write(key)
              print('service_account.json подготовлен из секрета GOOGLE_SERVICE_ACCOUNT_JSON')
          "

      - name: Запуск — ${{ matrix.title }}
        run: python run_all.py ${{ matrix.module }}

      - name: Логи и скриншоты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.module }}-${{ github.run_number }}
          path: |
            logs/
            screens/
            contacts_diagnostics/
          retention-days: 14
          if-no-files-found: ignore

  summary:
    name: Итоговый отчёт в Telegram
    needs: [plan, test]
    if: ${{ always() && needs.plan.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    env:
      TG_ENABLED: ${{ vars.TG_ENABLED || '1' }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHATS: ${{ secrets.TG_CHATS }}
      MODULES: ${{ needs.plan.outputs.modules || 'all' }}
      WEB_ONLY: ${{ needs.plan.outputs.web_only || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: python -m pip install requests gspread google-auth openpyxl

      - name: Скачивание результатов всех модулей
        uses: actions/download-artifact@v4
        with:
          pattern: report-*-${{ github.run_number }}
          path: logs/collected_artifacts
          merge-multiple: false
        continue-on-error: true

      - name: Отправка полного итога автотеста в Telegram
        run: |
          FLAGS=""
          if [ "$WEB_ONLY" = "true" ]; then FLAGS="--web-only"; fi
          python run_all.py --notify-summary "$MODULES" $FLAGS


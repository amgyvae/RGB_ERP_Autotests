name: Daily ERP Autotests (08:00 Almaty)

on:
  # Ежедневный запуск к 08:00 утра по времени Алматы (UTC+5).
  # GitHub Actions интерпретирует cron строго в UTC: 02:45 UTC = 07:45 Алматы
  # (с учётом стандартной очереди GitHub Actions 10–15 мин фактический старт в ~08:00 Алматы).
  schedule:
    - cron: "45 2 * * *"
  # Поддержка точного внешнего вебхука (например cron-job.org) при необходимости
  repository_dispatch:
    types: [run-autotests]
  # Кнопка «Run workflow» во вкладке Actions для ручного запуска.
  workflow_dispatch:
    inputs:
      modules:
        description: "Модули через запятую (all = все): contacts,passport,smeta,finance,supply,quality,discussions,wiki,news,manager,tasks,gpr,contracts,waybills,invoices,acts"
        required: false
        default: "all"
      ncalayer:
        description: "Модули с ЭЦП (NCALayer) на облачном раннере"
        type: choice
        options: [skip, include]
        default: skip

# Не запускать два прогона одновременно: тесты пишут в одну таблицу и используют одни аккаунты.
concurrency:
  group: erp-autotests
  cancel-in-progress: false

permissions:
  contents: read

env:
  TZ: Asia/Almaty
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  plan:
    name: Планирование прогона
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      modules: ${{ steps.matrix.outputs.modules }}
      web_only: ${{ steps.matrix.outputs.web_only }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей для уведомлений
        run: python -m pip install requests gspread google-auth openpyxl

      - name: Список модулей и уведомление о старте в Telegram
        id: matrix
        env:
          MODULES: ${{ inputs.modules || vars.AUTOTEST_MODULES || 'all' }}
          # На облачном Ubuntu нет NCALayer — такие модули пропускаются,
          # если не выбран self-hosted раннер или ncalayer=include.
          WEB_ONLY: ${{ (vars.AUTOTEST_RUNNER || 'ubuntu-latest') == 'ubuntu-latest' && inputs.ncalayer != 'include' }}
          TG_ENABLED: ${{ vars.TG_ENABLED || '1' }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHATS: ${{ secrets.TG_CHATS }}
          RGB_ACCOUNT1_LOGIN: jyktmargyplay2@gmail.com
        run: |
          FLAGS=""
          if [ "$WEB_ONLY" = "true" ]; then FLAGS="--web-only"; fi
          MATRIX=$(python run_all.py --matrix "$MODULES" $FLAGS)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"
          echo "web_only=$WEB_ONLY" >> "$GITHUB_OUTPUT"
          echo "### План прогона" >> "$GITHUB_STEP_SUMMARY"
          echo "Модули: \`$MODULES\` · только web: \`$WEB_ONLY\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$MATRIX"
          python run_all.py --notify-start "$MODULES" $FLAGS

  test:
    name: ${{ matrix.title }}
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.matrix).include[0] }}
    # ubuntu-latest — облако GitHub; self-hosted — ваш Windows-ПК с NCALayer
    # (задаётся переменной репозитория AUTOTEST_RUNNER).
    runs-on: ${{ vars.AUTOTEST_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false   # упавший модуль не останавливает остальные
      max-parallel: 1    # строго по очереди
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      HEADLESS: ${{ vars.HEADLESS || '1' }}
      TG_ENABLED: ${{ vars.TG_ENABLED || '1' }}
      RGB_ACCOUNT1_LOGIN: jyktmargyplay2@gmail.com
      RGB_ACCOUNT1_PASSWORD: '12341234'
      RGB_ACCOUNT1_PASSWORD_ALT: '12341234'
      RGB_ACCOUNT2_LOGIN: jyktmargyplay2@gmail.com
      RGB_ACCOUNT2_PASSWORD: '12341234'
      RGB_ACCOUNT3_LOGIN: jyktmargyplay2@gmail.com
      RGB_ACCOUNT3_PASSWORD: '12341234'
      NCA_KEY1_PASSWORD: ${{ secrets.NCA_KEY1_PASSWORD }}
      NCA_KEY2_PASSWORD: ${{ secrets.NCA_KEY2_PASSWORD }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHATS: ${{ secrets.TG_CHATS }}
      GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: python -m pip install -r requirements.txt

      - name: Подготовка папки загрузок
        run: python -c "import os; os.makedirs(os.path.expanduser('~/Downloads'), exist_ok=True)"

      - name: Запуск — ${{ matrix.title }}
        run: python run_all.py ${{ matrix.module }}

      - name: Логи и скриншоты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.module }}-${{ github.run_number }}
          path: |
            logs/
            screens/
            contacts_diagnostics/
          retention-days: 14
          if-no-files-found: ignore

  summary:
    name: Итоговый отчёт в Telegram
    needs: [plan, test]
    if: always()
    runs-on: ubuntu-latest
    env:
      TG_ENABLED: ${{ vars.TG_ENABLED || '1' }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHATS: ${{ secrets.TG_CHATS }}
      MODULES: ${{ needs.plan.outputs.modules || 'all' }}
      WEB_ONLY: ${{ needs.plan.outputs.web_only || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: python -m pip install requests gspread google-auth openpyxl

      - name: Скачивание результатов всех модулей
        uses: actions/download-artifact@v4
        with:
          pattern: report-*-${{ github.run_number }}
          path: logs/collected_artifacts
          merge-multiple: false
        continue-on-error: true

      - name: Отправка полного итога автотеста в Telegram
        run: |
          FLAGS=""
          if [ "$WEB_ONLY" = "true" ]; then FLAGS="--web-only"; fi
          python run_all.py --notify-summary "$MODULES" $FLAGS
